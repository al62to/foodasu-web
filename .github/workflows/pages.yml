# Baut die Website mit Astro, prüft sie und veröffentlicht sie auf GitHub Pages. Veröffentlicht wird nur vom Zweig
# main; andere Zweige und Pull Requests werden nur gebaut und geprüft.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # "npm ci": genau die Versionen der Sperrdatei. Die Sperrdatei entsteht unter Windows; npm lässt dort zwei Pakete
      # weg, die hier gebraucht werden (@emnapi/core und @emnapi/runtime in der Fassung, die
      # @astrojs/compiler-binding-wasm32-wasi verlangt). Sie sind von Hand eingetragen. Bricht dieser Schritt nach einem
      # "npm install" unter Windows mit "Missing: @emnapi/..." ab, fehlen die beiden Einträge wieder.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run pruefen
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    if: github.ref == 'refs/heads/main'
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - id: seite
        uses: actions/deploy-pages@v4
